# .github/workflows/required-checks-audit.yml
name: required-checks-audit (Sentinel)

on:
  workflow_dispatch:

permissions:
  checks: read
  contents: read
  statuses: read
  pull-requests: read

concurrency:
  group: required-checks-audit-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  audit:
    name: required-checks-audit (Sentinel)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SHA: ${{ github.sha }}
    steps:
      - name: Audit required check status
        shell: bash
        run: |
          set -u

          deadline=$((SECONDS + 780))
          sleep_seconds=10
          summary_file="${GITHUB_STEP_SUMMARY:-}"
          required_checks=("ci (Unit/Integration + Lint gesammelt)" "policy-gate")
          required_type="github-check-run"

          echo "Sentinel mode: audit-only"
          echo "SHA: $SHA"
          echo "Required checks: ${required_checks[*]}"
          echo "Required type: $required_type"

          final_state=""
          final_detail=""
          while true; do
            if ! check_runs_json="$(gh api -H "Accept: application/vnd.github+json" \
              "/repos/$REPO/commits/$SHA/check-runs?per_page=100" 2>&1)"; then
              echo "::warning::Check Runs read failed: $check_runs_json"
              if [[ $SECONDS -ge $deadline ]]; then
                final_state="TIMEOUT"
                final_detail="Check Runs API failed until deadline"
                break
              fi
              sleep "$sleep_seconds"
              continue
            fi

            unresolved=()
            failed_check=""
            for required_check in "${required_checks[@]}"; do
              check_run="$(
                jq -c --arg n "$required_check" \
                  '[.check_runs[] | select(.name == $n)] | last // {}' \
                  <<<"$check_runs_json"
              )"
              conclusion="$(
                jq -r '.conclusion // "__MISSING__"' <<<"$check_run" |
                  tr '[:lower:]' '[:upper:]'
              )"
              run_url="$(
                jq -r '.html_url // empty' <<<"$check_run"
              )"
              case "$conclusion" in
                SUCCESS|NEUTRAL)
                  final_detail="$final_detail${final_detail:+; }$required_check=SUCCESS"
                  ;;
                PENDING|IN_PROGRESS|QUEUED)
                  echo "PENDING: $required_check (conclusion=$conclusion)"
                  unresolved+=("$required_check")
                  ;;
                __MISSING__)
                  echo "MISSING: $required_check"
                  unresolved+=("$required_check")
                  ;;
                *)
                  final_state="FAILED"
                  final_detail="$final_detail${final_detail:+; }$required_check=$conclusion"
                  if [[ -n "$run_url" ]]; then
                    final_detail="$final_detail (url=$run_url)"
                  fi
                  failed_check="$required_check"
                  ;;
              esac
            done

            if [[ -n "$failed_check" ]]; then
              break
            fi

            if [[ "${#unresolved[@]}" -gt 0 ]]; then
              if [[ $SECONDS -ge $deadline ]]; then
                if [[ -z "$final_state" ]]; then
                  final_state="UNRESOLVED"
                  final_detail="required Checks not SUCCESS until deadline: ${unresolved[*]}"
                fi
                break
              fi
              sleep "$sleep_seconds"
              continue
            fi

            if [[ -z "$final_state" ]]; then
              final_state="OK"
            fi
            break
          done

          case "$final_state" in
            OK)
              echo "OK: required checks all SUCCESS"
              echo "Detail: $final_detail"
              ;;
            *)
              echo "::warning::required checks -> $final_state ($final_detail)"
              ;;
          esac

          if [[ -n "$summary_file" ]]; then
            {
              echo "## Sentinel Summary"
              echo
              echo "- Mode: \`audit-only\`"
              echo "- SHA: \`$SHA\`"
              echo "- Required checks: \`${required_checks[*]}\`"
              echo "- Required type: \`$required_type\`"
              echo "- Result: \`$final_state\`"
              echo "- Detail: ${final_detail//|/\\|}"
            } >> "$summary_file"
          fi

          echo "Sentinel completed in audit-only mode."
