name: Repository Canon Guard

# #4540: PR coverage is in the hosted fast profile (ci.yml pipeline, docs stage:
# `python -m tools.ci.repository_canon_guard` via ci/stages/docs.py). No separate
# PR trigger — the required gate `ci (Unit/Integration + Lint gesammelt)` runs it.
# Retained: push-to-main (post-squash tip) + manual dispatch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Block runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          echo "Scanning for runtime artifacts..."
          bad="$(
            {
              git ls-files | grep -E '(^|/)(__pycache__/|\.pytest_cache/|.*\.pyc$|.*\.pyo$|(^|/)logs/)' || true
              git ls-files | grep -E '.*\.log$' | grep -vE '^docs/runbooks/evidence/.*\.log$' || true
            } | sort -u
          )"
          if [ -n "$bad" ]; then
            echo "Found forbidden runtime artifacts tracked in git:"
            echo "$bad"
            exit 1
          fi

      - name: Basic secret pattern scan (best-effort)
        shell: bash
        run: |
          set -euo pipefail
          echo "Best-effort secret scan (patterns)."
          include_paths=(
            agents
            knowledge
            governance
            docs
          )
          git fetch origin main >/dev/null 2>&1 || true
          # This lightweight guard is intentionally limited to credential-shaped
          # signatures. Generic words such as "secret", "token", and "api_key"
          # are normal vocabulary in security documentation and caused every
          # moved document to be treated as a leak. The dedicated gitleaks
          # workflows remain the canonical full-content and history scanners.
          credential_pattern='(BEGIN (RSA|OPENSSH|EC|DSA) PRIVATE KEY|xox[baprs]-[A-Za-z0-9-]{10,}|gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16})'
          # Scan only newly added lines. Existing security documentation contains
          # credential-shape examples and must not make unrelated edits fail.
          hits="$(
            git diff --unified=0 origin/main -- "${include_paths[@]}" \
              | grep -E '^\+' \
              | grep -vE '^\+\+\+' \
              | grep -EI "$credential_pattern" \
              || true
          )"
          if [ -n "$hits" ]; then
            echo "Potential secret-like strings found in geänderten Dateien (review required):"
            echo "$hits"
            echo ""
            echo "If these are false positives, adjust the workflow patterns or move values to local .env/.secrets."
            exit 1
          fi

      - name: Enforce canonical documentation and governance folders
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking canonical documentation and governance folders..."
          required_dirs=(
            agents
            docs
            knowledge
            knowledge/governance
            .github/governance
          )
          for d in "${required_dirs[@]}"; do
            if [ ! -d "$d" ]; then
              echo "Missing required canonical folder: $d"
              exit 1
            fi
          done

      - name: Enforce the single-repository canon
        shell: bash
        run: |
          set -euo pipefail
          if [ -f .gitmodules ]; then
            echo "A second repository must not be attached as a submodule."
            exit 1
          fi
          grep -q 'Repository `Claire_de_Binare` is the only canonical source\|Repository `Claire_de_Binare` ist die einzige kanonische Quelle' \
            docs/meta/REPOSITORY_CANON.md
          grep -q 'docs/meta/REPOSITORY_CANON.md' AGENTS.md agents/AGENTS.md

          docs_word='[Dd][Oo][Cc][Ss]'
          hub_word='[Hh][Uu][Bb]'
          working_word='[Ww][Oo][Rr][Kk][Ii][Nn][Gg]'
          repo_word='[Rr][Ee][Pp][Oo]'
          legacy_pattern="(${docs_word}[ _-]?${hub_word}|${working_word}[ _-]?${repo_word}|Claire_de_Binare_${docs_word})"
          # Immutable provenance retains historical payloads verbatim. The
          # terminology gate applies to active repository surfaces, not frozen
          # ledgers, evidence, fixtures, archives, or session records.
          legacy_content="$(git grep -nEI "$legacy_pattern" -- . \
            ':(exclude)artifacts/**' \
            ':(exclude)docs/archive/**' \
            ':(exclude)docs/evidence/**' \
            ':(exclude)docs/governance/status/**' \
            ':(exclude)knowledge/agent_trust/ledger/**' \
            ':(exclude)knowledge/archive/**' \
            ':(exclude)knowledge/context_build/**' \
            ':(exclude)knowledge/evidence/**' \
            ':(exclude)knowledge/executions/**' \
            ':(exclude)knowledge/logs/**' \
            ':(exclude)knowledge/reports/**' \
            ':(exclude)knowledge/reviews/**' \
            ':(exclude)tests/fixtures/**' || true)"
          legacy_paths="$(git ls-files \
            | grep -vE '^(artifacts/|docs/archive/|docs/evidence/|docs/governance/status/|knowledge/agent_trust/ledger/|knowledge/archive/|knowledge/context_build/|knowledge/evidence/|knowledge/executions/|knowledge/logs/|knowledge/reports/|knowledge/reviews/|tests/fixtures/)' \
            | grep -EI "$legacy_pattern" || true)"
          if [ -n "$legacy_content" ] || [ -n "$legacy_paths" ]; then
            echo "Retired repository terminology must not re-enter canonical files or paths."
            [ -z "$legacy_content" ] || echo "$legacy_content"
            [ -z "$legacy_paths" ] || echo "$legacy_paths"
            exit 1
          fi
