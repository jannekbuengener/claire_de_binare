# Hosted GitHub Actions CI (merge-relevant on `main`, #4540).
# PR-path re-enabled (removed in #4401): `ci (Unit/Integration + Lint gesammelt)`
# is again a branch-protection-required Check Run on pull_request branches [main].
# Local Fast-CI (`python ci/scripts/run.py --profile fast`) remains a developer
# preflight / diagnosis / optional evidence publisher — no longer a required
# context after #4540. See docs/runbooks/merge_policy_ci_gate.md.
# This workflow is not the Docker CI lab baseline; 431B baseline is base.yml + test.yml.
name: ci

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    paths:
      - 'core/**'
      - 'services/**'
      - 'tests/**'
      - 'infrastructure/**'
      - '.github/workflows/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # GitHub-native remainder: path-filtered SurrealQL syntax check (no Docker).
  # Full governance (MCP + surreal + drift) also runs via --profile fast below.
  # Uses surreal validate (NOT surrealkit validate — that command does not exist).
  # Binary downloaded directly from pinned GitHub release (v3.1.5).
  # No DB connection, no schema sync, no migration. Pure syntax check.
  surrealdb-validate:
    name: surrealdb-validate
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' &&
       contains(toJSON(github.event.commits.*.modified), 'infrastructure/surrealdb/'))
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install SurrealDB CLI (pinned v3.1.5)
        run: |
          curl -fsSL "https://github.com/surrealdb/surrealdb/releases/download/v3.1.5/surreal-v3.1.5.linux-amd64.tgz" | tar xz -C /tmp
          /tmp/surreal version
      - name: Validate .surql syntax
        run: |
          /tmp/surreal validate "${{ github.workspace }}/infrastructure/surrealdb/context_intelligence_v0_deploy.surql"
          /tmp/surreal validate "${{ github.workspace }}/infrastructure/surrealdb/context_intelligence_v0.surql"

  ci:
    # Stable check-run name (branch-protection-required on `main` after #4540).
    name: ci (Unit/Integration + Lint gesammelt)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Fetch origin/main for lint base
        # Full tip history of main is required so docs status-freshness can
        # resolve claimed main SHAs (shallow depth=1 makes ancestors unreachable).
        run: git fetch --no-tags origin main

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -r requirements-mcp.txt
          # Toolchain SSOT (#4206): black/ruff pins from requirements-dev.txt only.
          # Do not reinstall unversioned ruff/black after the requirements install.

      - name: Install SurrealDB CLI (pinned v3.1.5)
        run: |
          curl -fsSL "https://github.com/surrealdb/surrealdb/releases/download/v3.1.5/surreal-v3.1.5.linux-amd64.tgz" | tar xz -C /tmp
          sudo install -m 0755 /tmp/surreal /usr/local/bin/surreal
          surreal version

      - name: Run canonical local CI (fast profile)
        env:
          PYTHONUNBUFFERED: "1"
        run: python ci/scripts/run.py --profile fast

      - name: Upload local CI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-fast-${{ github.sha }}
          path: ci/artifacts/
          if-no-files-found: warn
          retention-days: 7
