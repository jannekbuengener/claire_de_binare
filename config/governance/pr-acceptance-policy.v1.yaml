    "merge_executor": {
      "role_id": "cdb_final_head_merge_executor",
      "cursor_display_name": "Merge Agent",
      "approve_pr": false,
      "merge_pr": true,
      "modify_code": false,
      "success_mutation": "regular_merge",
      "admin_bypass": false,
      "context_mode": "repo-only"
