        "admin_merge",
        "merge_execution",
        "approve_pr",
        "issue_closure",
        "stale_evidence",
        "own_ci_logic",
        "own_routing_logic"
      ],
      "success_decision": "FINAL_HEAD_READY_FOR_APPROVAL",
      "handoff_role": "cdb_final_head_pr_approval_gate"
    }
  },
  "sha_rules": {
    "head_sha_pattern": "^[a-f0-9]{40}$",
    "base_sha_pattern": "^[a-f0-9]{40}$",
    "lowercase_hex_only": true
